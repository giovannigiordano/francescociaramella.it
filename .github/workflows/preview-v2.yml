name: Deploy v2 preview to Surge

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: surge-preview-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://puny-cherry.surge.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to puny-cherry.surge.sh
        run: scripts/preview.sh puny-cherry.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
